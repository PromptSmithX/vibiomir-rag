[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vibiomir-crawler"
version = "0.1.0"
description = "Reliable, resumable crawler for the ViBioMIR corpus"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.11,<4",
  "colorama>=0.4.6,<1",
  "huggingface-hub>=1.0,<3",
  "lingua-language-detector>=2.1,<3",
  "orjson>=3.10,<4",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "pyarrow>=19,<26",
  "pyyaml>=6,<7",
  "selectolax>=0.3.27,<1",
  "tldextract>=5.1,<6",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
vibiomir-crawler = "crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.windows-test-tmp"
cache_dir = ".windows-pytest-cache"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
